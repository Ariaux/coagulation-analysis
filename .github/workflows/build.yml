name: Build and Release

on:
  push:
    branches: [main]

concurrency:
  group: coagulation-release-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            lock: requirements-windows.lock
          - os: macos-14
            lock: requirements-macos.lock
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime and packaging dependencies
        run: python -m pip install --require-hashes -r "${{ matrix.lock }}"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: >-
          python -m py_compile
          app.py
          app_standalone.py
          analysis_service.py
          batch_service.py
          grid_detector.py
          lan_access.py
          web_controller.py
          web_launcher.py
          research/__init__.py
          research/annotate_inner_squares.py
          research/evaluate_cropping.py

      - name: Remove research-only dependency before packaging
        run: |
          python -m pip uninstall --yes matplotlib
          python -c "from importlib.util import find_spec; assert find_spec('matplotlib') is None"

      - name: Record packaging environment
        run: python -m pip freeze --all > build-manifest.txt

      - name: Build Windows offline website
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --clean --noconfirm --onedir --collect-all gradio --collect-all qrcode --collect-data safehttpx --collect-data groovy --add-data "web_styles.css;." --name StartWebsite web_launcher.py

      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --clean --noconfirm --onedir --name CoagulationAnalysis app_standalone.py

      - name: Smoke test packaged Windows website
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          try {
            $listener.Start()
            $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          } finally {
            $listener.Stop()
          }
          $siteUrl = "http://127.0.0.1:$port"
          $resultsRoot = Join-Path $env:RUNNER_TEMP "packaged-results"
          if (Test-Path $resultsRoot) {
            Remove-Item $resultsRoot -Recurse -Force
          }
          $process = Start-Process `
            -FilePath "dist/StartWebsite/StartWebsite.exe" `
            -ArgumentList @("--port", "$port", "--no-browser", "--results-root", "$resultsRoot") `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $response = $null
            $lastError = $null
            do {
              if ($process.HasExited) {
                throw "Packaged website exited before becoming ready with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri $siteUrl `
                  -UseBasicParsing `
                  -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  break
                }
              } catch {
                $lastError = $_
              }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if ($null -eq $response -or $response.StatusCode -ne 200) {
              throw "Packaged website did not return HTTP 200 within 60 seconds. Last error: $lastError"
            }
            $html = [string]$response.Content
            if ($html -notmatch "Coagulation Analysis") {
              throw "Packaged website response did not contain the application title."
            }
            $forbiddenExternalReferences = @(
              "http://",
              "https://",
              "@import",
              "url(",
              "fonts.googleapis.com",
              "fonts.gstatic.com",
              "cdnjs.cloudflare.com",
              "cdn.jsdelivr.net",
              "unpkg.com"
            )
            foreach ($reference in $forbiddenExternalReferences) {
              if ($html.IndexOf($reference, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "Packaged website response contained forbidden external reference: $reference"
              }
            }
            if ($html -match '(?i)(?:src|href)\s*=\s*["'']//') {
              throw "Packaged website response referenced a protocol-relative resource."
            }

            $env:PACKAGED_SITE_URL = $siteUrl
            $env:PACKAGED_RESULTS_ROOT = $resultsRoot
            $env:PACKAGED_FIXTURE_PATH = Join-Path $env:RUNNER_TEMP "synthetic-fixture.png"
            $clientScript = Join-Path $env:RUNNER_TEMP "packaged-functional-smoke.py"
            $clientSmoke = @'
          import os
          from pathlib import Path

          import cv2
          from gradio_client import Client, handle_file

          from tests.test_grid_detector import make_fixture


          fixture_path = Path(os.environ["PACKAGED_FIXTURE_PATH"])
          image, _ = make_fixture(filled=(2, 5, 8))
          success, encoded = cv2.imencode(".png", image)
          if not success:
              raise RuntimeError("Could not encode the synthetic fixture.")
          encoded.tofile(str(fixture_path))

          client = Client(os.environ["PACKAGED_SITE_URL"], verbose=False)
          client.predict(
              handle_file(str(fixture_path)),
              5,
              60,
              api_name="/lambda",
          )

          results_root = Path(os.environ["PACKAGED_RESULTS_ROOT"])
          bundles = [path for path in results_root.iterdir() if path.is_dir()]
          if len(bundles) != 1:
              raise AssertionError(f"Expected one analysis bundle, found {bundles}.")
          bundle = bundles[0]
          cell_files = sorted(bundle.glob("cell_*.png"))
          if len(cell_files) != 9:
              raise AssertionError(f"Expected nine cell PNGs, found {cell_files}.")
          for pattern in (
              "*_results.csv",
              "*_results.json",
              "*_grid_overlay.png",
              "*_heatmap.png",
              "*_analysis.zip",
          ):
              matches = list(bundle.glob(pattern))
              if len(matches) != 1:
                  raise AssertionError(
                      f"Expected one {pattern} artifact, found {matches}."
                  )
          '@
            Set-Content -LiteralPath $clientScript -Value $clientSmoke -Encoding utf8
            $pythonExecutable = (Get-Command python).Source
            $clientProcess = Start-Process `
              -FilePath $pythonExecutable `
              -ArgumentList @($clientScript) `
              -NoNewWindow `
              -PassThru
            if (-not $clientProcess.WaitForExit(60000)) {
              & taskkill.exe /PID $clientProcess.Id /T /F | Out-Null
              throw "Packaged website functional analysis smoke timed out."
            }
            if ($clientProcess.ExitCode -ne 0) {
              throw "Packaged website functional analysis smoke failed."
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              if (-not $process.WaitForExit(10000)) {
                throw "Could not terminate the packaged website process tree."
              }
            }
          }

      - name: Assemble Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseRoot = "release/CoagulationAnalysis-Windows"
          if (Test-Path "release") {
            Remove-Item "release" -Recurse -Force
          }
          if (Test-Path "CoagulationAnalysis-Windows.zip") {
            Remove-Item "CoagulationAnalysis-Windows.zip" -Force
          }
          New-Item -ItemType Directory -Force -Path "$releaseRoot/Web" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseRoot/Desktop" | Out-Null
          Copy-Item -Path "dist/StartWebsite/*" -Destination "$releaseRoot/Web" -Recurse -Force
          Copy-Item -Path "dist/CoagulationAnalysis/*" -Destination "$releaseRoot/Desktop" -Recurse -Force
          Copy-Item README.md "$releaseRoot/README.md"
          Copy-Item build-manifest.txt "$releaseRoot/build-manifest.txt"

          if (-not (Test-Path "$releaseRoot/Web/StartWebsite.exe" -PathType Leaf)) {
            throw "Windows website executable is missing from the release layout."
          }
          if (-not (Test-Path "$releaseRoot/Desktop/CoagulationAnalysis.exe" -PathType Leaf)) {
            throw "Windows desktop executable is missing from the release layout."
          }
          Compress-Archive -Path "$releaseRoot/*" -DestinationPath "CoagulationAnalysis-Windows.zip"

      - name: Build macOS desktop app
        if: runner.os == 'macOS'
        run: pyinstaller --clean --noconfirm --onedir --name CoagulationAnalysis app_standalone.py

      - name: Assemble macOS desktop archive
        if: runner.os == 'macOS'
        run: |
          test -f dist/CoagulationAnalysis/CoagulationAnalysis
          cp build-manifest.txt dist/CoagulationAnalysis/build-manifest.txt
          rm -f CoagulationAnalysis-Mac.zip
          cd dist
          zip -r ../CoagulationAnalysis-Mac.zip CoagulationAnalysis

      - name: Upload Windows package artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: CoagulationAnalysis-Windows.zip
          if-no-files-found: error

      - name: Upload macOS package artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: CoagulationAnalysis-Mac.zip
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify build is current main head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          expected_sha = os.environ["GITHUB_SHA"]
          request = Request(
              f"https://api.github.com/repos/{repository}/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              current_sha = json.load(response)["object"]["sha"]
          if current_sha != expected_sha:
              raise SystemExit(
                  f"Refusing stale release: main is {current_sha}, build is {expected_sha}."
              )
          PY

      - name: Upload platform packages to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/CoagulationAnalysis-Windows.zip
            release-artifacts/CoagulationAnalysis-Mac.zip
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Coagulation Analysis"
          body: |
            Latest offline builds for Windows and macOS.

            Windows: Web/StartWebsite.exe is the recommended offline entry. It serves the bundled interface on this computer only and does not require an external website at runtime. Desktop/CoagulationAnalysis.exe remains available for drag-and-drop desktop analysis.

            macOS: CoagulationAnalysis is the desktop executable.
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
